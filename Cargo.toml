[package]
name = "agentsync"
version = "0.2.0"
edition = "2024"
description = "A cross-platform desktop client for synchronizing coding-agent resources"
authors = ["AgentSync contributors"]
license = "MIT"
repository = "https://github.com/nhanhoang1405/agentsync"
rust-version = "1.85"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6.0"
hex = "0.4"
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3.20"
toml = "0.9"
toml_edit = "0.23"
tokio-postgres-rustls = "0.13"
walkdir = "2.5"
