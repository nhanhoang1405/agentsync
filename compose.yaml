name: agentsync

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: agentsync
      POSTGRES_USER: agentsync
      POSTGRES_PASSWORD: agentsync-dev-only
    ports:
      - "${AGENTSYNC_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsync -d agentsync"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agentsync-postgres:/var/lib/postgresql/data

volumes:
  agentsync-postgres:
