name: Terminal app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --locked
      - name: Linux terminal smoke test
        if: runner.os == 'Linux'
        run: |
          python3 scripts/tui_smoke.py
          python3 scripts/sqlite_smoke.py

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked

  mysql-storage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.4', 'mariadb:11']
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: agentsync-test-root
          MYSQL_DATABASE: agentsync_test
          MYSQL_USER: agentsync
          MYSQL_PASSWORD: agentsync-test-only
          MARIADB_ROOT_PASSWORD: agentsync-test-root
          MARIADB_DATABASE: agentsync_test
          MARIADB_USER: agentsync
          MARIADB_PASSWORD: agentsync-test-only
        ports:
          - 33306:3306
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/3306'"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Verify database storage contract
        env:
          AGENTSYNC_TEST_MYSQL_URL: mysql://agentsync:agentsync-test-only@127.0.0.1:33306/agentsync_test?ssl-mode=DISABLED
        run: cargo +stable test --locked mysql_contract -- --ignored

  libsql-storage:
    runs-on: ubuntu-latest
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 33307:8080
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Verify remote libSQL storage contract
        env:
          AGENTSYNC_TEST_LIBSQL_URL: http://127.0.0.1:33307
        run: cargo +stable test --locked libsql_storage_contract -- --ignored

  postgres-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentsync_test
          POSTGRES_USER: agentsync
          POSTGRES_PASSWORD: agentsync-test-only
        ports:
          - 33309:5432
        options: >-
          --health-cmd "pg_isready -U agentsync -d agentsync_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: cargo +stable build --locked
      - name: Verify legacy archives and partial snapshots
        env:
          AGENTSYNC_TEST_DATABASE_URL: postgres://agentsync:agentsync-test-only@127.0.0.1:33309/agentsync_test
        run: python3 scripts/postgres_version_smoke.py
